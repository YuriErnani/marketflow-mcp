spring.application.name=marketflow-mcp

spring.ai.mcp.server.name=marketflow-mcp
spring.ai.mcp.server.version=0.0.1

api.marketflow.url=${MARKETFLOW_API_URL:http://localhost:8080}
api.marketflow.email=${MARKETFLOW_EMAIL:}
api.marketflow.senha=${MARKETFLOW_SENHA:}

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

spring.ai.mcp.server.stdio=true
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.threshold.console=OFF
logging.file.name=${user.home}/marketflow-mcp-logs/marketflow-mcp.log